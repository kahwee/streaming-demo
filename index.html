<!DOCTYPE html>
<html>
<head>
    <title>Simple Claude Chat</title>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <textarea id="user-input" placeholder="Type your message here..." rows="4" cols="50"></textarea>
        <button id="send-button">Send</button>
    </div>

    <script>
        const messages = [];
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        async function sendMessage() {
            const userMessage = userInput.value.trim();
            if (!userMessage) return;

            // Add user message to UI and history
            displayMessage('user', userMessage);
            messages.push({role: "user", content: userMessage});
            userInput.value = '';

            try {
                // Create assistant message placeholder
                const assistantMessageElem = displayMessage('assistant', '');

                // Call our proxy server
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({messages})
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API error: ${response.status}`);
                }

                // Handle streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantResponse = '';

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && !line.includes('[DONE]')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.type === 'content_block_delta' && data.delta?.text) {
                                    assistantResponse += data.delta.text;
                                    assistantMessageElem.textContent = assistantResponse;
                                }
                            } catch (e) {}
                        }
                    }
                }

                // Add assistant response to history
                messages.push({role: "assistant", content: assistantResponse});

            } catch (error) {
                console.error('Error:', error);
                displayMessage('system', 'Error: ' + error.message);
            }
        }

        function displayMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = role;
            messageDiv.textContent = `${role === 'user' ? 'You' : 'Claude'}: ${content}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageDiv;
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
